<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="assets/land/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;450;500;600&family=Geist+Mono:wght@400;500&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css?v=62">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<title>Checkout — Shree Shyam Enterprises</title>
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<main id="main" class="wrap wide">
  <header class="page-head" style="position:relative">
    <p class="eyebrow">Checkout</p>
    <h1>Your order.</h1>
    <div class="steps-bar" aria-hidden="true"><span class="on">Review</span><span class="on">Details</span><span id="stepDone">Confirmed</span></div>
  </header>
  <div class="co">
    <section class="co-panel" aria-label="Your items">
      <h2>In your cart</h2>
      <div id="coItems"></div>
      <div class="totals" id="coTotals"></div>
      <a class="btn line sm" href="shop.html" style="margin-top:12px">Add more items</a>
    </section>
    <section class="co-panel" aria-label="Details and payment" id="coSide">
      <form id="coForm" novalidate>
        <h2>Delivery details</h2>
        <div class="field"><label for="coName">Name or firm</label><input id="coName" required autocomplete="organization"><span class="err"></span></div>
        <div class="grid2">
          <div class="field"><label for="coPhone">Mobile</label><input id="coPhone" inputmode="numeric" pattern="[6-9][0-9]{9}" required autocomplete="tel" maxlength="10" placeholder="10 digits"><span class="err"></span></div>
          <div class="field"><label for="coGst">GSTIN (optional)</label><input id="coGst" maxlength="15" style="text-transform:uppercase" autocomplete="off"></div>
        </div>
        <div class="field"><label for="coEmail">Email, for your bill</label><input id="coEmail" type="email" inputmode="email" maxlength="120" autocomplete="email" placeholder="you@company.com"><span class="err" id="coEmailErr"></span></div>
        <div class="field"><label for="coAddr">Delivery address</label><textarea id="coAddr" rows="3" required placeholder="Plot, RIICO area, city, pincode"></textarea><span class="err"></span></div>
        <h2 style="margin-top:6px">Payment</h2>
        <div class="pay" id="payPanel"></div>
        <p class="co-err" id="coErr" role="alert"></p>
        <div class="co-total">
          <div><small id="coTotalLabel">Order total</small><b id="copayTotal">—</b></div>
          <button class="btn" id="coPay" type="submit">Place order</button>
        </div>
        <p class="co-note" id="coNote"></p>
      </form>
    </section>
  </div>
</main>
<script src="assets/app.js?v=57"></script>
<script src="assets/checkout.js?v=7"></script>
</body>
</html>
