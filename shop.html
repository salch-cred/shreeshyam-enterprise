<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="assets/land/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;450;500;600&family=Geist+Mono:wght@400;500&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css?v=59">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<title>Catalogue — Shree Shyam Enterprises</title>
<meta name="description" content="Buy bearings, belts, pneumatics, fasteners, tools and electricals from Shree Shyam Enterprises, Neemrana. GST invoice on every order.">
<meta name="theme-color" content="#ffffff">
</head>
<body data-stage="shop">
<a class="skip" href="#grid">Skip to products</a>
<canvas id="stage" aria-hidden="true"></canvas>
<main id="main">
  <section class="shop-hero">
    <div class="wrap wide" style="width:100%">
      <p class="eyebrow">Catalogue</p>
      <h1>Find it, add it,<br>we dispatch it.</h1>
      <p>Search by part number, make or name. Anything not listed, ask us and we source it.</p>
      <label class="shop-search"><span class="sr">Search products</span>
        <input id="q" type="search" placeholder="6205, FRL, V-belt, Polymatic" autocomplete="off"><kbd>/</kbd>
      </label>
    </div>
  </section>

  <section class="shop-body">
    <div class="depts" id="depts" aria-label="Shop by department"></div>
    <div class="shop-tools"><div class="wrap wide">
      <span class="count" id="count"></span>
      <button class="btn line sm filter-btn" id="fBtn">Filters</button>
      <div class="seg" id="slabSeg" aria-label="Rate type">
        <button data-s="retail" aria-pressed="true">Counter</button><button data-s="wholesale" aria-pressed="false">Project</button>
      </div>
      <select id="sort" aria-label="Sort products">
        <option value="az">A to Z</option><option value="za">Z to A</option><option value="stock">In stock</option>
      </select>
    </div></div>
    <div class="wrap wide shop-lay">
      <aside class="filters" id="filters" aria-label="Filters">
        <h4>Availability</h4><div id="fStock"></div>
        <h4>Type</h4><div id="fCats"></div>
        <h4>Make</h4><div id="fBrands"></div>
        <button class="btn line sm" id="fClear" style="margin-top:14px">Clear filters</button>
      </aside>
      <div>
        <div id="grid" class="grid-p" aria-live="polite"></div>
        <button class="btn line more" id="more" hidden>Load more</button>
      </div>
    </div>
  </section>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="qv" aria-label="Product details" aria-hidden="true">
  <div class="sheet-head">
    <div><p class="eyebrow" id="qvBrand" style="margin:0 0 4px"></p><h2 id="qvName"></h2></div>
    <button class="sheet-x" id="qvClose" aria-label="Close">×</button>
  </div>
  <div class="sheet-body">
    <div class="pv-media"><div class="draft" aria-hidden="true"></div><img id="qvImg" alt=""></div>
    <div class="pv-rate"><span id="qvPrice"></span><small id="qvUnit"></small></div>
    <dl class="pv-spec" id="qvSpecs"></dl>
    <p id="qvStock" style="font-size:15px;margin-top:12px"></p>
  </div>
  <div class="sheet-foot">
    <a class="btn line" id="qvWa" target="_blank" rel="noopener">Ask on WhatsApp</a>
    <div class="stepper"><button id="qvMinus" aria-label="Decrease quantity">−</button><b id="qvQty">1</b><button id="qvPlus" aria-label="Increase quantity">+</button></div>
    <button class="btn" id="qvAdd">Add to cart</button>
  </div>
</aside>

<div class="cartbar no-print" id="cartbar">
  <span id="cartbarText"></span>
  <a class="btn sm" href="checkout.html">Checkout</a>
</div>

<script src="assets/app.js?v=56"></script>
<script src="assets/shop.js?v=34"></script>
<script type="module" src="assets/stage.js?v=8"></script>
</body>
</html>
