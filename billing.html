?<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Billing — Shree Shyam Enterprises</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1E3A8B">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231D4ED8'/><text x='16' y='22' font-size='18' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>S</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css">

</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="grain no-print" aria-hidden="true"></div>
<header class="island no-print"><div class="island-inner">
<a class="brand" href="index.html"><span class="brand-mark">S</span><span>Shree Shyam<small>Billing counter</small></span></a>
<nav class="navlinks"><a href="index.html">Site</a><a href="shop.html">Shop</a><a href="admin.html">Admin</a></nav>
<span class="live"><i></i>Counter open</span>
</div></header>

<main id="main" class="admin-shell no-print">
<div id="gate" class="gate-card rv in">
<p class="eyebrow">Counter only</p>
<h1 class="title" style="font-size:32px;line-height:36px">Open billing</h1>
<p class="lead" style="font-size:15px">Every TAX bill cuts stock and updates the day book.</p>
<div class="pinrow"><input id="pin" inputmode="numeric" type="password" autocomplete="off" placeholder="••••" aria-label="Billing PIN"></div>
<span class="err" id="pinErr" style="color:#9A3412;font-size:13px;min-height:20px;display:block"></span>
<button class="btn btn-primary" id="unlock" style="width:100%;justify-content:center"><i class="hgi-stroke hgi-lock"></i>Unlock</button>
</div>

<div id="billWrap" hidden>
<div class="console-head">
<div><p class="eyebrow">New bill</p>
<h1 class="title" style="margin:0"><span id="invNo">Draft</span></h1></div>
<span class="device"><i class="hgi-stroke hgi-calendar-01" style="font-size:16px"></i><span id="invDate"></span></span>
</div>

<div class="pos">
<section aria-label="Add items">
<div class="cmdbar">
<label class="search"><i class="hgi-stroke hgi-search-01"></i><input id="bq" type="search" placeholder="Type to add — cylinder, valve, FRL, bearing…" aria-label="Search products"><kbd>/</kbd></label>
<select id="slab" aria-label="Price slab" style="background:#173178;color:#fff;border:1px solid var(--line-dark);border-radius:999px;padding:8px 12px;font:inherit;font-size:14px"><option value="retail">Retail</option><option value="wholesale">Wholesale</option></select>
</div>
<div id="held" class="heldrow"></div>
<div id="res" class="picklist"></div>
</section>

<section aria-label="Bill">
<div class="billcard">
<div class="field"><label for="cust">Customer</label><input id="cust" placeholder="Name, site, phone" autocomplete="off" list="custList"><datalist id="custList"></datalist></div>
<div class="formgrid">
<div class="field"><label for="cphone">Phone</label><input id="cphone" inputmode="tel" placeholder="98…" autocomplete="off"></div>
<div class="field"><label for="cgstin">GSTIN (optional)</label><input id="cgstin" placeholder="27XXXXX0000X1Z5" autocomplete="off" style="text-transform:uppercase"></div>
</div>
<div id="lines"></div>
<div class="formgrid" style="margin-top:12px">
<div class="field"><label for="disc">Discount Rs</label><input id="disc" type="number" min="0" value="0"></div>
<div class="field"><label for="paid">Received Rs</label><input id="paid" type="number" min="0" value="0"></div>
</div>
<div class="field"><label>Payment mode</label><div class="seg" id="modeSeg">
<button data-m="UPI" aria-pressed="true">UPI</button><button data-m="Cash" aria-pressed="false">Cash</button><button data-m="Transfer" aria-pressed="false">Transfer</button><button data-m="Credit" aria-pressed="false">Credit</button>
</div></div>
<div class="totals" id="totals"></div>
<div class="bactions">
<p class="err" id="billErr" style="color:#9A3412;font-size:13px;min-height:20px;margin:4px 0"></p>
<div style="display:flex;gap:10px;flex-wrap:wrap">
<button class="btn btn-primary" id="save" style="flex:1;justify-content:center"><i class="hgi-stroke hgi-printer"></i>Save + Print</button>
<button class="btn btn-ghost" id="est">Estimate</button>
<button class="btn btn-ghost" id="hold">Hold</button>
</div>
</div>
</div>
</section>
</div>

<section class="daybook" aria-label="Today's counter">
<div class="dbhead"><div><p class="eyebrow" style="margin:0">Day book</p><h2>Today at the counter</h2></div>
<input id="dbq" type="search" placeholder="Search bills…" aria-label="Search bills"></div>
<div class="statrow" id="dbStats" style="margin-top:12px">
<div><strong id="dbN">0</strong><span>Bills today</span></div>
<div><strong id="dbBilled">Rs 0</strong><span>Billed</span></div>
<div><strong id="dbGot">Rs 0</strong><span>Received</span></div>
<div><strong id="dbDue">Rs 0</strong><span>Udhaar</span></div>
</div>

</main>

<div id="printArea" aria-hidden="true"></div>
<div class="toasts no-print" id="toasts" aria-live="polite"></div>

<script src="assets/app.js?v=20261011h"></script>
<script>
let ALL=[],cart=[],mode='UPI';const BILL_PIN='2580';
const toast=(m,i='checkmark-circle-01')=>{const t=document.createElement('div');t.className='toast';
  t.innerHTML=`<i class="hgi-stroke hgi-${i}"></i><span>${SSE.esc(m)}</span>`;SSE.$('#toasts').appendChild(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),500)},2600);};
const invs=()=>{try{return JSON.parse(localStorage.getItem('sse_invoices')||'[]');}catch{return[];}};
const today=()=>new Date().toISOString().slice(0,10);
SSE.$('#unlock').onclick=()=>{if(SSE.$('#pin').value===BILL_PIN){sessionStorage.setItem('sse_bill','1');openBill();}
  else{SSE.$('#pinErr').textContent='Wrong PIN.';const g=SSE.$('#gate');g.classList.remove('shake');void g.offsetWidth;g.classList.add('shake');}};
SSE.$('#pin').addEventListener('keydown',e=>{if(e.key==='Enter')SSE.$('#unlock').click()});
if(sessionStorage.getItem('sse_bill')==='1')openBill();
function openBill(){SSE.$('#gate').hidden=true;SSE.$('#billWrap').hidden=false;init();}

async function init(){
  ALL=await SSE.seed();
  SSE.$('#invDate').textContent=new Date().toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const seen={};SSE.$('#custList').innerHTML=invs().map(r=>r.customer).filter(c=>c&&!seen[c]&&(seen[c]=1)).slice(-30).map(c=>`<option value="${SSE.esc(c)}">`).join('');
  SSE.$('#bq').oninput=draw;SSE.$('#slab').onchange=draw;
  SSE.$('#bq').addEventListener('keydown',e=>{if(e.key==='Enter'){const first=SSE.$('#res').querySelector('button.add');if(first)first.click();}});
  SSE.$('#disc').oninput=drawLines;SSE.$('#paid').oninput=drawLines;
  SSE.$('#save').onclick=()=>save('TAX');SSE.$('#est').onclick=()=>save('EST');SSE.$('#hold').onclick=hold;
  SSE.$('#dbq').oninput=daybook;
  SSE.$('#modeSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    SSE.$('#modeSeg').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false'));
    b.setAttribute('aria-pressed','true');mode=b.dataset.m;drawLines();});
  document.addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();SSE.$('#bq').focus();}});
  draw();drawLines();held();daybook();SSE.tabs();
}
function draw(){
  const q=SSE.$('#bq').value.toLowerCase(),slab=SSE.$('#slab').value;
  const f=ALL.filter(p=>(p.name+' '+(p.brand||'')).toLowerCase().includes(q)).slice(0,9);
  const box=SSE.$('#res');box.innerHTML='';
  if(!q){box.innerHTML=`<div class="empty"><i class="hgi-stroke hgi-search-01"></i><b>Search the shelf</b><p>Industrial rates are quote-based — type the agreed rate on each line after adding. Enter adds the first match.</p></div>`;return;}
  if(!f.length){box.innerHTML=`<div class="empty"><i class="hgi-stroke hgi-package-search"></i><b>Not on the shelf</b><p>Check spelling or add it from Admin.</p></div>`;return;}
  f.forEach((p,i)=>{const rate=slab==='wholesale'?p.rate_wholesale:p.rate_retail;
    const low=p.stock<=(p.min_stock||5);
    const d=document.createElement('div');d.className='pick rowin';d.style.animationDelay=Math.min(i*40,320)+'ms';
    d.innerHTML=`<img loading="lazy" src="${SSE.safeImg(p.image)}" alt="">
    <div style="flex:1"><b>${SSE.esc(p.name)}</b><span>${SSE.esc(p.brand)} · Stock ${Number(p.stock)||0} ${low?'· <b style="color:#9A3412">Low</b>':''} · +${Number(p.gst_pct)||0}% GST</span></div>
    <b>${rate?SSE.fmt(rate):"On request"}</b><button class="btn btn-amber add" style="padding:6px 12px;font-size:13px">Add</button>`;
    d.querySelector('button').onclick=ev=>{ev.stopPropagation();addItem(p,rate);};
    d.onclick=()=>d.querySelector('button').click();
    box.appendChild(d);});
}
function addItem(p,rate){
  const ex=cart.find(c=>c.id===p.id),nxt=(ex?ex.qty:0)+1;
  if(nxt>(Number(p.stock)||0))toast('Only '+p.stock+' in stock — bill anyway with care','alert-01');
  if(ex)ex.qty++;else cart.push({id:p.id,name:p.name,qty:1,rate,gst_pct:p.gst_pct,hsn:p.hsn||''});
  SSE.$('#billErr').textContent='';drawLines();
}
function drawLines(){
  const t=SSE.totals(cart,Number(SSE.$('#disc').value||0));
  const paid=Math.max(0,Number(SSE.$('#paid').value||0));
  const box=SSE.$('#lines');
  if(!cart.length){box.innerHTML=`<div class="empty" style="padding:24px"><i class="hgi-stroke hgi-shopping-cart-01"></i><b>Bill is empty</b><p>Add items from the left.</p></div>`;}
  else box.innerHTML=cart.map((c,i)=>`<div class="line">
    <div style="flex:1;min-width:0"><b>${SSE.esc(c.name)}</b><span>GST ${c.gst_pct}%</span></div>
    <div class="stepper"><button data-i="${i}" data-d="-1" aria-label="Decrease">−</button><b>${c.qty}</b><button data-i="${i}" data-d="1" aria-label="Increase">+</button></div>
    <input class="ratein" type="number" min="0" value="${c.rate}" data-i="${i}" aria-label="Rate for ${SSE.esc(c.name)}">
    <b style="min-width:86px;text-align:right">${SSE.fmt(c.qty*c.rate)}</b>
    <button class="rm" data-i="${i}" aria-label="Remove line">×</button></div>`).join('');
  box.querySelectorAll('.stepper button').forEach(b=>b.onclick=()=>{const c=cart[Number(b.dataset.i)];
    c.qty=Math.max(1,c.qty+Number(b.dataset.d));drawLines();});
  box.querySelectorAll('.ratein').forEach(r=>r.onchange=()=>{cart[Number(r.dataset.i)].rate=Math.max(0,Number(r.value)||0);drawLines();});
  box.querySelectorAll('.rm').forEach(b=>b.onclick=()=>{cart.splice(Number(b.dataset.i),1);drawLines();});
  const due=Math.max(0,t.grand-paid);
  SSE.$('#totals').innerHTML=`<div><span>Subtotal</span><b>${SSE.fmt(t.sub)}</b></div>
  <div><span>GST</span><b>${SSE.fmt(t.gst)}</b></div>
  <div><span>Discount</span><b>—^' ${SSE.fmt(Number(SSE.$('#disc').value||0))}</b></div>
  <div class="grand"><span>Total · ${SSE.esc(mode)}</span><b>${SSE.fmt(t.grand)}</b></div>
  ${due>0?`<div class="due"><span>Balance to udhaar</span><b>${SSE.fmt(due)}</b></div>`:`<div class="due ok"><span>Settled</span><b>Fully paid</b></div>`}`;
}
function hold(){
  if(!cart.length){SSE.$('#billErr').textContent='Nothing to hold — bill is empty.';return;}
  try{const h=JSON.parse(localStorage.getItem('sse_held')||'[]');
    h.push({id:'H'+Date.now(),customer:SSE.$('#cust').value.trim()||'Walk-in',items:cart,created:new Date().toISOString()});
    localStorage.setItem('sse_held',JSON.stringify(h));}catch{}
  cart=[];drawLines();held();toast('Bill held — resume anytime','inbox');
}
function held(){
  let h=[];try{h=JSON.parse(localStorage.getItem('sse_held')||'[]');}catch{}
  SSE.$('#held').innerHTML=h.map(x=>`<span class="heldchip">${SSE.esc(x.customer)} · ${x.items.reduce((a,c)=>a+c.qty,0)} pcs
    <button class="go" data-id="${x.id}">Resume</button><button data-x="${x.id}" aria-label="Discard held bill">—-</button></span>`).join('');
  SSE.$('#held').querySelectorAll('.go').forEach(b=>b.onclick=()=>{const all=JSON.parse(localStorage.getItem('sse_held')||'[]');
    const it=all.find(x=>x.id===b.dataset.id);cart=it.items;SSE.$('#cust').value=it.customer==='Walk-in'?'':it.customer;
    localStorage.setItem('sse_held',JSON.stringify(all.filter(x=>x.id!==b.dataset.id)));drawLines();held();});
  SSE.$('#held').querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{const all=JSON.parse(localStorage.getItem('sse_held')||'[]');
    localStorage.setItem('sse_held',JSON.stringify(all.filter(x=>x.id!==b.dataset.x)));held();});
}
function daybook(){
  const q=(SSE.$('#dbq').value||'').toLowerCase();
  const list=invs().filter(r=>(r.date||'').slice(0,10)===today()&&(!q||(r.no+' '+(r.customer||'')).toLowerCase().includes(q))).reverse();
  const billed=list.filter(r=>r.type==='TAX').reduce((a,r)=>a+(r.grand||0),0);
  const got=list.reduce((a,r)=>a+(r.paid||0),0);
  SSE.$('#dbN').textContent=list.length;SSE.$('#dbBilled').textContent=SSE.fmt(billed);
  SSE.$('#dbGot').textContent=SSE.fmt(got);SSE.$('#dbDue').textContent=SSE.fmt(list.reduce((a,r)=>a+(r.balance||0),0));
  SSE.$('#dblist').innerHTML=list.length?list.map(r=>`<div class="dbrow">
    <div><b>${SSE.esc(r.no)}</b> <span class="pill ${r.type==='TAX'?'info':'warn'}">${r.type}</span><small>${SSE.esc(r.customer||'Walk-in')} · ${SSE.fmt(r.grand)} · paid ${SSE.fmt(r.paid)}${r.balance?` · due ${SSE.fmt(r.balance)}`:''}</small></div>
    <div><b>${SSE.fmt(r.grand)}</b></div>
    <div class="rpr"><button class="btn btn-ghost rp" data-no="${SSE.esc(r.no)}"><i class="hgi-stroke hgi-printer"></i>Reprint</button></div></div>`).join('')
    :`<div class="empty"><i class="hgi-stroke hgi-file-01"></i><b>No bills yet today</b><p>Saved bills land here with one tap reprint.</p></div>`;
  SSE.$('#dblist').querySelectorAll('.rp').forEach(b=>b.onclick=()=>{
    const r=invs().find(x=>x.no===b.dataset.no);if(!r)return;buildPrint(r);printNow();});
}
async function save(type){
  if(!cart.length){SSE.$('#billErr').textContent='Add at least one item before saving.';return;}
  SSE.$('#billErr').textContent='';
  if(type==='TAX'&&!SSE.$('#cust').value.trim()&&!SSE.$('#cphone').value.trim()){
    SSE.$('#billErr').textContent='Add a customer name or phone for a GST bill.';return;}
  const t=SSE.totals(cart,Number(SSE.$('#disc').value||0));
  const paid=Math.max(0,Number(SSE.$('#paid').value||0));
  const no=type==='TAX'?SSE.seq():'EST-'+Date.now();
  const rec={no,date:new Date().toISOString(),type,customer:SSE.$('#cust').value.trim(),phone:SSE.$('#cphone').value.trim(),
    gstin:SSE.$('#cgstin').value.trim().toUpperCase(),mode,items:cart,sub:t.sub,gst:t.gst,disc:Number(SSE.$('#disc').value||0),
    grand:t.grand,paid,balance:Math.max(0,t.grand-paid)};
  try{const a=invs();a.push(rec);localStorage.setItem('sse_invoices',JSON.stringify(a));
    if(rec.balance>0){const l=JSON.parse(localStorage.getItem('sse_ledger')||'[]');
      l.push({no,customer:rec.customer||rec.phone||'Walk-in',total:rec.grand,paid:rec.paid,balance:rec.balance});localStorage.setItem('sse_ledger',JSON.stringify(l));}}catch{}
  if(type==='TAX'){const all=await SSE.all();
    for(const c of cart){const p=all.find(x=>x.id===c.id);if(p){p.stock-=c.qty;await SSE.put(p);SSE.logStock(p.id,-c.qty,no);}}
    ALL=all;}
  SSE.$('#invNo').textContent=no;
  buildPrint(rec);printNow();
  cart=[];SSE.$('#paid').value=0;SSE.$('#disc').value=0;drawLines();daybook();
  toast((type==='TAX'?'Invoice ':'Estimate ')+no+' saved');
}
function printNow(){
  const qr=SSE.$('#printArea').querySelector('img.qr');
  let done=false;const go=()=>{if(done)return;done=true;setTimeout(()=>window.print(),200);};
  if(qr){qr.onload=go;setTimeout(go,2500);}else go();
}

/* Amount in words, Indian numbering */
function words(n){
  const o=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const ty=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two=x=>x<20?o[x]:ty[Math.floor(x/10)]+(x%10?' '+o[x%10]:'');
  const three=x=>{const h=Math.floor(x/100),r=x%100;return(h?o[h]+' Hundred'+(r?' ':''):'')+(r?two(r):'');};
  if(!n)return'Zero';
  let s='',cr=Math.floor(n/1e7),lk=Math.floor(n%1e7/1e5),th=Math.floor(n%1e5/1e3),rest=n%1e3;
  if(cr)s+=three(cr)+' Crore ';if(lk)s+=two(lk)+' Lakh ';if(th)s+=two(th)+' Thousand ';if(rest)s+=three(rest);
  return(s+'Rupees Only').replace(/\s+/g,' ').trim();
}
function buildPrint(r){
  const c=SSE.content(),cgst=r.gst/2,sgst=r.gst-r.gst/2;
  const upi=c.upi_id||'shreeshyam@upi';
  const qr='https://api.qrserver.com/v1/create-qr-code/?size=140x140&data='+encodeURIComponent(`upi://pay?pa=${upi}&am=${r.grand}&tn=${r.no}`);
  const hsn={};r.items.forEach(it=>{const k=(it.hsn||'—')+'|'+it.gst_pct;hsn[k]=hsn[k]||{hsn:it.hsn||'—',rate:it.gst_pct,tx:0,g:0};
    const tx=it.qty*it.rate;hsn[k].tx+=tx;hsn[k].g+=tx*it.gst_pct/100;});
  const rows=r.items.map((it,i)=>{const tx=it.qty*it.rate,g=tx*it.gst_pct/100;
    return`<tr><td>${i+1}</td><td><b>${SSE.esc(it.name)}</b><br><span>HSN ${SSE.esc(it.hsn||'—')}</span></td>
    <td class="r">${it.qty}</td><td class="r">${SSE.fmt(it.rate)}</td><td class="r">${SSE.fmt(tx)}</td>
    <td class="r">${it.gst_pct}%</td><td class="r">${SSE.fmt(g)}</td><td class="r"><b>${SSE.fmt(tx+g)}</b></td></tr>`;}).join('');
  const copy=(label,brk)=>`<div class="inv${brk?' brk':''}">
    <div class="copy">${label}</div>
    <div class="ihead"><div><h1>Shree Shyam Enterprises</h1>
    <p>${SSE.esc(c.address||'Main Market Road')}${c.gstin&&c.gstin.indexOf('ADD')!==0?' · GSTIN '+SSE.esc(c.gstin):''} · ${SSE.esc(c.phone||'')}</p></div>
    <div class="r"><h2>${r.type==='TAX'?'Tax Invoice':'Estimate'}</h2><p>${r.type==='TAX'?'':'Not a tax invoice'}</p></div></div>
    <div class="imeta"><div><span>Bill no</span><b>${SSE.esc(r.no)}</b></div>
    <div><span>Date</span><b>${new Date(r.date).toLocaleString('en-IN')}</b></div>
    <div><span>Customer</span><b>${SSE.esc(r.customer||'Walk-in')}${r.phone?' · '+SSE.esc(r.phone):''}</b></div>
    <div><span>Customer GSTIN</span><b>${SSE.esc(r.gstin||'—')}</b></div></div>
    <table class="itbl"><thead><tr><th>#</th><th>Item</th><th class="r">Qty</th><th class="r">Rate</th><th class="r">Taxable</th><th class="r">GST</th><th class="r">GST Amt</th><th class="r">Amount</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="irow"><div class="ileft">
      <p><span>Amount in words</span><b>${words(r.grand)}</b></p>
      <table class="htbl"><thead><tr><th>HSN</th><th class="r">Rate</th><th class="r">Taxable</th><th class="r">CGST</th><th class="r">SGST</th></tr></thead><tbody>
      ${Object.values(hsn).map(h=>`<tr><td>${SSE.esc(h.hsn)}</td><td class="r">${h.rate}%</td><td class="r">${SSE.fmt(h.tx)}</td><td class="r">${SSE.fmt(h.g/2)}</td><td class="r">${SSE.fmt(h.g-h.g/2)}</td></tr>`).join('')}</tbody></table>
      <div class="qrbox"><img class="qr" src="${qr}" alt="UPI QR"><div><b>Pay ${SSE.fmt(r.grand)}</b><span>UPI ${SSE.esc(upi)} · ${SSE.esc(r.mode)}</span></div></div>
    </div><div class="iright">
      <div><span>Subtotal</span><b>${SSE.fmt(r.sub)}</b></div>
      <div><span>Discount</span><b>—^' ${SSE.fmt(r.disc)}</b></div>
      <div><span>CGST</span><b>${SSE.fmt(cgst)}</b></div>
      <div><span>SGST</span><b>${SSE.fmt(sgst)}</b></div>
      <div><span>Round off</span><b>${SSE.fmt(r.grand-(r.sub+r.gst-r.disc))}</b></div>
      <div class="grand"><span>Total</span><b>${SSE.fmt(r.grand)}</b></div>
      <div><span>Received</span><b>${SSE.fmt(r.paid)}</b></div>
      <div><span>Balance</span><b>${SSE.fmt(r.balance)}</b></div>
    </div></div>
    <div class="ifoot"><div><span>Terms</span><p>Goods once sold will be taken back only in original pack within 7 days with bill. Tinted shades final sale. Interest 18% p.a. after due date. Disputes at local jurisdiction.</p></div>
    <div class="sign"><span>For Shree Shyam Enterprises</span><b>Authorised signatory</b></div></div>
  </div>`;
  SSE.$('#printArea').innerHTML=r.type==='TAX'?copy('Original for Recipient',true)+copy('Duplicate for Supplier',false)
    :copy('Estimate — valid 7 days',false);
}
</script></body></html>
