<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="assets/land/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;450;500;600&family=Geist+Mono:wght@400;500&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css?v=52">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<title>Your account — Shree Shyam Enterprises</title>
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
</head>
<body class="acct on-dark" data-nav="dark" data-stage="account">
<a class="skip" href="#main">Skip to content</a>
<canvas id="stage" aria-hidden="true"></canvas>
<main id="main">
  <section class="wrap acct-stage" id="authView">
    <div></div>
    <div>
      <p class="eyebrow">Your account</p>
      <h1>Save your plant details once.</h1>
      <p class="lede">Checkout fills itself, and your orders and repeat lists stay in one place on this device.</p>
      <form id="detailsForm" novalidate>
        <div class="field"><label for="aname">Plant or purchaser name</label><input id="aname" autocomplete="organization"><span class="err" id="nameErr"></span></div>
        <div class="grid2">
          <div class="field"><label for="aphone">Mobile</label><input id="aphone" type="tel" inputmode="numeric" maxlength="10" placeholder="10 digits" autocomplete="tel"><span class="err" id="phoneErr"></span></div>
          <div class="field"><label for="agst">GSTIN (optional)</label><input id="agst" maxlength="15" style="text-transform:uppercase" autocomplete="off"></div>
        </div>
        <div class="field"><label for="aaddr">Delivery address (optional)</label><textarea id="aaddr" rows="2"></textarea></div>
        <button class="btn" type="submit">Save details</button>
      </form>
    </div>
  </section>

  <section class="wrap acct-me" id="meView" hidden>
    <div class="acct-top">
      <div><p class="eyebrow">Your account</p><h1 id="meName"></h1><p id="meLine"></p></div>
      <div class="acct-actions">
        <a class="btn" href="shop.html">Open the catalogue</a>
        <a class="btn line" id="ledgerWa" target="_blank" rel="noopener">Ask for a statement</a>
        <button class="btn line" id="editMe">Edit</button>
        <button class="btn line" id="logout">Sign out</button>
      </div>
    </div>
    <div class="acct-orders" id="orders" aria-label="Your orders"></div>
  </section>
</main>
<script src="assets/app.js?v=52"></script>
<script src="assets/account.js?v=2"></script>
<script type="module" src="assets/stage.js?v=8"></script>
</body>
</html>
